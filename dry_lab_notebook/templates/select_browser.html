<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>File Browser</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Dry Lab Notebook</a>
        </div>
    </nav>

    <div class="container mt-4">
        <form method="post" class="file-browser-form">
            {% csrf_token %}
            <h2>File Browser</h2>
            <p class="text-muted">Directory: <code>/{{ current_path }}</code></p>
            
            <div class="list-group">
                {% if current_path %}
                    <a href="?path={{ parent_path }}" class="list-group-item list-group-item-action">
                        📁 .. (Parent Directory)
                    </a>
                {% endif %}

                {% for d in dirs %}
                    <a href="?path={{ current_path }}{{ d }}/" class="list-group-item list-group-item-action">
                        📁 {{ d }}
                    </a>
                {% endfor %}
                
                {% if files %}
                    <div class="list-group-item">
                        <h5>Files</h5>
                        <div class="list-unstyled">
                            {% for f in files %}
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="files" 
                                           value="{{ current_path }}{{ f }}" id="file_{{ forloop.counter }}">
                                    <label class="form-check-label" for="file_{{ forloop.counter }}">
                                        📄 {{ f }}
                                    </label>
                                </div>
                            {% endfor %}
                        </div>
                    </div>
                {% else %}
                    <div class="list-group-item text-muted">No files in this directory</div>
                {% endif %}
            </div>

            <div class="mt-3">
                <button type="submit" class="btn btn-primary">Process Selected Files</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
