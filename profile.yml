logger:
  stomp:
    host: "localhost"
    port: 61613
    user: "${STOMP_USER}"
    password: "${STOMP_PASSWORD}"
    queue: "${STOMP_STREAM_QUEUE}"
    use_stream: true
    include_events: "WORKFLOW_STARTED,JOB_STARTED,JOB_FINISHED,WORKFLOW_FINISHED,JOB_ERROR"
    heartbeat_send: 10000
    heartbeat_receive: 10000