name: dry-lab-notebook-app

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"
      - "15674:15674"
      - "61613:61613"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq_enabled_plugins:/etc/rabbitmq/enabled_plugins
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro

  web:
    image: ${WEB_IMAGE:-dry-lab-notebook:latest}
    build: .
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - staticfiles_data:/app/staticfiles
    environment:
      - DEBUG=0
      - RABBITMQ_URL=stomp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:61613
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
    env_file:
      - .env
    depends_on:
      - rabbitmq
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles_data:/staticfiles:ro
    depends_on:
      - web

  ssh-tunnel:
    build:
      context: .
      dockerfile: Dockerfile.ssh-tunnel
    entrypoint: ["tail"]
    command: ["-f", "/dev/null"]
    environment:
      - SSH_TUNNEL_HOST=${SSH_TUNNEL_HOST}
      - SSH_TUNNEL_SSH_PORT=${SSH_TUNNEL_SSH_PORT:-22}
      - SSH_TUNNEL_USER=${SSH_TUNNEL_USER:-tunnel}
      - STOMP_TUNNEL_REMOTE_PORT=${STOMP_TUNNEL_REMOTE_PORT:-61613}
    depends_on:
      - rabbitmq
    restart: unless-stopped

volumes:
  rabbitmq_data:
  staticfiles_data: